architectury {
    common rootProject.enabled_platforms.split(',')
}

repositories {
    maven {
        url "https://cursemaven.com"
    }

    maven {
        name = "Xaero's Maven"
        url = "https://chocolateminecraft.com/maven"
    }

    maven { url = "https://maven.terraformersmc.com/releases" }

    maven { url = "https://maven.shedaniel.me/" }
}

dependencies {
    // We depend on Fabric Loader here to use the Fabric @Environment annotations,
    // which get remapped to the correct annotations on each platform.
    // Do NOT use other classes from Fabric Loader.
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"


    modImplementation "xaero.minimap:xaerominimap-fabric-$minecraft_version:$xaerominimap_version"
    modImplementation "xaero.map:xaeroworldmap-fabric-$minecraft_version:$xaeroworldmap_version"
    modImplementation "xaero.lib:xaerolib-fabric-$minecraft_version:$xaerolib_version"


    modImplementation "com.terraformersmc:modmenu:$mod_menu_version"
    modImplementation "me.shedaniel.cloth:cloth-config-fabric:$cloth_config_version"
}
